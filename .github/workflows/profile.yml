name: profile widgets

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/**', '.github/workflows/profile.yml']

permissions:
  contents: write
  actions: write

concurrency:
  group: profile-widgets
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Draw stat cards
        run: node scripts/build-stats.mjs dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Draw contribution snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?palette=github-dark&color_snake=#ff8a3d&color_dots=#161b27,#4a2a17,#8a4a20,#d9732f,#ffb46b

      # Plain git instead of an action so a GitHub hiccup on push gets retried, not failed.
      - name: Publish to the output branch
        working-directory: dist
        run: |
          git init -q -b output
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -q -m 'Update profile widgets'
          for attempt in 1 2 3 4 5; do
            if git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" output; then exit 0; fi
            echo "push failed (attempt $attempt), retrying"
            sleep $((attempt * 15))
          done
          exit 1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # GitHub switches scheduled workflows off after 60 days without repo activity;
      # re-enabling resets that timer.
      - name: Keep the schedule enabled
        run: gh api -X PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/profile.yml/enable"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
